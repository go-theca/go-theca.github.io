baseURL = "https://go-theca.github.io/"
title = "go-theca"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "blurb" is the honest one-line summary drawn from the
# repo's own README.
[[params.repos]]
  name = "theca"
  role = "v0.3.0"
  docs = "https://go-theca.github.io/docs/"
  release = "https://github.com/go-theca/theca/releases/tag/v0.3.0"
  blurb = "Theca: an encrypted container format in pure Go, with a library and a command line (create, info, verify, import, export, enroll-key, serve). Sectors are authenticated (XChaCha20 xor AES-256-CTR, HMAC-SHA-256) under a Merkle tree and a write-ahead journal, and the header has no magic bytes. A password (Argon2id), a recovery code or a FIDO2 security key opens it, with a 2-of-3 policy available; the key always pairs with another factor. New in v0.2.0: theca create --fs exfat, and theca serve, which serves the exFAT inside the container over SMB (signed, loopback only, one random account per run); theca serve --mount mounts it in Finder, GNOME Files or Explorer with no password dialog, and unmounts at stop. Measured on macOS only; Linux and Windows are not yet measured with theca. The format may still change before v1. Since v0.3.0 the sharing is a library package, share (Start, Stop, URL, MountPath, Done, Err; a container with no exFAT is refused with ErrNoFilesystem)."

[[params.repos]]
  name = "gui"
  role = "v0.1.0"
  docs = "https://go-theca.github.io/docs/latest/repos/gui/"
  release = "https://github.com/go-theca/gui/releases/tag/v0.1.0"
  blurb = "A portable desktop GUI for Theca containers, built with go-widgets and pure Go: create, unlock, verify, import, export and enroll a FIDO2 key in a window. A Share / Stop sharing toggle serves the exFAT inside the container over SMB on loopback and mounts it in the file manager, with Open in file manager; the share stops before the container is closed. Measured on macOS; Linux and Windows windows are built in CI but not yet run by hand. The Create screen makes raw volumes in v0.1.0, so a container to share is made with theca create --fs exfat."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
  accent = "#0079a8"
  accentDark = "#22cce2"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-theca.github.io/docs/"
  label = "Get started"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-theca"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64"]
