baseURL = "https://go-theca.github.io/"
title = "go-theca"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "blurb" is the honest one-line summary drawn from the
# repo's own README.
[[params.repos]]
  name = "theca"
  role = "v0.10.3"
  docs = "https://go-theca.github.io/docs/"
  release = "https://github.com/go-theca/theca/releases/tag/v0.27.0"
  blurb = "Theca: an encrypted container format in pure Go, with a library and a command line (create, info, verify, import, export, enroll-key, serve). Sectors are authenticated (XChaCha20 xor AES-256-CTR, HMAC-SHA-256) under a Merkle tree and a write-ahead journal, and the header has no magic bytes. A password (Argon2id), a recovery code or a FIDO2 security key opens it, with a 2-of-3 policy available; the key always pairs with another factor. New in v0.2.0: theca create --fs exfat, and theca serve, which serves the exFAT inside the container over SMB (signed, loopback only, one random account per run); theca serve --mount mounts it in Finder, GNOME Files or Explorer with no password dialog, and unmounts at stop. New in v0.6.0: theca slots list|remove (remove a key slot by the factors that open it) and bounded caches (64 MiB by default, wiped on close). New in v0.7.0: AES-256-CTR through go-encryptions/ctr and Argon2id through go-encryptions/argon2; against the C references on one core, AES-256-CTR is 0.97 of OpenSSL on an AMD Zen 4 core (1.03 on an Apple M4 Max) and Argon2id is 0.73 of libsodium on the M4 Max and 0.25 on Zen 4. New in v0.8.0: FIDO2 on Linux (hidraw) and Windows (webauthn.dll, with Windows' own dialog); only macOS is measured with a real key. New in v0.9.0: an optional TPM 2.0 rollback counter (create --counter tpm), Linux only for now; the TPM's owner can delete it, which is a denial of service and not a rollback; measured against a software TPM, not a hardware one. New in v0.10.0 and v0.10.1: theca counter rebind recovers a container whose counter is gone (it needs the unlocking factors and the TPM owner password, deletes a still-present old counter, and protection restarts from then; an old copy shows the same message as a reset TPM, and rebinding is not the way to open it), new counters carry NO_DA, and until v0.18.0 the header bound a counter kind, not a TPM identity (issue #39). New in v0.10.2: each share draws a random account name (theca- and 8 random characters), which fixes a second mount failing on macOS. New in v0.10.3: a FIDO2 key's fingerprint is used only when the key reports uv, a wrong fingerprint is retried up to 5 times, and a locked or missing fingerprint falls back to the PIN (new ErrUVLocked if none); not measured on a real YubiKey Bio. New in v0.12.0: --password-from, --recovery-from and --pin-from read a secret from a reference (file:, keychain: on macOS, secretservice: on Linux) instead of a plaintext file, through go-authn/secretsource; v0.14.0 adds keepassxc: (KeePassXC, macOS and Linux). No reference runs a command, and the -file flags are unchanged. New in v0.16.0: create --password-to and --recovery-to store the new password and the recovery code straight into a secret manager (--generate N draws the password), the password before the container exists. New in v0.17.0: enroll-key says that the password alone still opens the container after pairing and names the command that removes it; enroll-key --require does it in one step after one more touch proves the key opens the container; slots remove --remove/--keep take password+fido2 and recovery+fido2, verified with one touch before anything is written (the recovery code alone still opens a policy-any container until it is removed). Not run on a real key yet. New in v0.18.0: the rollback counter is pinned to the TPM it was made on (the digest of the Name of that TPM's endorsement key, in the authenticated header), checked at every mount before the counter is read, so another TPM with the same index, the same Name and a raised value is refused; containers made before open with a warning until theca counter rebind pins them. It does not stop whoever controls the TPM in use or holds a copy of its state; measured against software TPMs only. New in v0.20.0: theca profile add|list|remove names a container once (references to the secret manager and the key, never a secret), theca open NAME unlocks it with one touch, mounts it and leaves it running in the background, theca status says what is open, and theca close NAME unmounts and closes it; the session closes itself on screen lock, sleep or logout (logind on Linux, a 2 second poll on macOS), and not yet on Windows. A real lock or sleep has not been measured on either OS. Loopback only by default; serve --network serves beyond loopback only with signing and encryption both required. Measured on macOS only; Linux and Windows are not yet measured with theca. New in v0.21.0: the secret file flags (--password-file, --recovery-file, --pin-file, --tpm-auth-file, --tpm-owner-auth-file) are deprecated: they still work, are hidden from the help and warn on standard error naming their --X-from replacement, as does a file: reference in --password-from, --recovery-from and --pin-from; --tpm-auth-from now refuses file:. New in v0.22.0: on macOS the session closes on notifications (screen lock, will-sleep, session end) instead of the 2 second poll, so it closes before the sleep; the poll stays as the fallback, and theca open says which mode is active. A real lock or sleep is still unmeasured. New in v0.25.0: the key material in memory is hardened: the PIN and the recovery code are wiped byte slices like the password (a break for library callers; one immutable copy of the PIN stays inside go-authn/fido, and create still holds the recovery code it prints as a string), the background daemon turns core dumps off and refuses debuggers (Linux: RLIMIT_CORE and PR_SET_DUMPABLE; macOS: RLIMIT_CORE and PT_DENY_ATTACH), and the master secret, the slot wrap keys and their cipher caches are locked in RAM (--mlock=auto|off|required). The AES round keys inside the CTR library, transient keys on the stack and the HMAC pads are not locked. Measured on macOS arm64, single core, under a load slightly above 8: opening costs about 15 us more with a test-size KDF, and reads and writes are within noise. The format may still change before v1. New in v0.26.0: the TPM counter defaults to TPM Base Services on Windows (--tpm-device tbs:, through go-tpm2/devtpm v0.4.0); measured only as TBS_E_TPM_NOT_FOUND on a Windows 11 VM without a TPM, and not run against a real TPM. New in v0.26.1: a new container sizes its journal at one entry per 16 sectors (64 to 4096) instead of 64, because a commit costs about four flushes whatever its size; on macOS a 64 MiB sustained write went from 12.0 to 92.4 MiB/s through the library and from 7.6 to 28.8 MiB/s through the SMB share; an existing container keeps its journal size, and Linux is not measured. New in v0.27.0: theca journal resize FILE --out NEW writes a copy of a container with another journal size (FILE is never rewritten; NEW keeps the key slots, the policy and the counter binding, is verified by the hash of the volume, and the swap commands are printed, not run); the speed gain on a resized container is not measured yet. Since v0.3.0 the sharing is a library package, share (Start, Stop, URL, MountPath, Done, Err; a container with no exFAT is refused with ErrNoFilesystem). Since v0.4.0, share.Format lays exFAT onto a new container's volume, as create --fs exfat does."

[[params.repos]]
  name = "gui"
  role = "v0.4.0"
  docs = "https://go-theca.github.io/docs/latest/repos/gui/"
  release = "https://github.com/go-theca/gui/releases/tag/v0.4.0"
  blurb = "A portable desktop GUI for Theca containers, built with go-widgets and pure Go: create, unlock, verify, import, export and enroll a FIDO2 key in a window. Since v0.4.0 a My profiles screen lists the profiles of containers.toml with their state (closed, or open with the mount point and since when) and opens and closes them like theca open and theca close, through theca v0.23.0's session.Start; it never asks for or holds a secret, and shows when the security key is waiting for a touch; it needs the theca command installed, and no real container was opened from it in testing. A Share / Stop sharing toggle serves the exFAT inside the container over SMB on loopback and mounts it in the file manager, with Open in file manager; the share stops before the container is closed. Measured on macOS; Linux and Windows windows are built in CI but not yet run by hand. Since v0.3.0 it can share on the network (signing and encryption required, with a warning and a hidden password), has a Keyslots screen, and shows the security key's state (touch, PIN); the key states are tested with a fake key. Since v0.2.0 the Create screen has a filesystem choice, exFAT by default or a raw volume, so a shareable container is made from the GUI."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
  accent = "#0079a8"
  accentDark = "#22cce2"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-theca.github.io/docs/"
  label = "Get started"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-theca"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64"]
